<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NanoTox Assistant</title><style>*{box-sizing:border-box}body{background:#f5f2e9;color:#132f30;font:18px/1.6 "Microsoft YaHei",sans-serif;margin:0}main{max-width:1000px;margin:auto;padding:4vw}header{border-bottom:1px solid #69837a;padding-bottom:16px;display:flex;justify-content:space-between;align-items:center}h1{font:normal clamp(44px,8vw,84px) Georgia;margin:38px 0 4px}small,label{color:#506764}article{background:#fffdf6;padding:30px;border:1px solid #cad4ca;border-radius:14px;margin:20px 0}strong{font:54px Georgia;color:#007d74}input{accent-color:#007d74;width:100%}button{background:#007d74;border:0;padding:13px 20px;color:white;font:inherit;border-radius:6px;cursor:pointer}svg{width:100%;height:160px}output{display:block;margin-top:15px}p{margin:6px 0 16px}</style><main><header><b>N / T</b><small>研究演示　/　交互原型</small></header><h1>NanoTox Assistant</h1><p>纳米硒剂量与反应研究</p><article><small>样本 01　/　壳聚糖修饰纳米硒</small><h2>CS-SeNPs · HUVEC · 72 h</h2><label for="dose">选择浓度　<span id="unit"></span> μmol/L Se</label><input id="dose" type="range" min="0" max="11" value="0"><strong id="v"></strong>　预测细胞存活率<svg viewBox="0 0 620 160" role="img" aria-label="正浓度的对数等距排列，橙线为50%参考线"><path d="M10 137H610" stroke="#b34d27"/><polyline id="line" fill="none" stroke="#007d74" stroke-width="3"/><circle id="point" r="6" fill="#b34d27"/></svg><small>曲线取自冻结模型的归档预测。橙线为 50% 参考线。</small></article><article><small>512 μmol/L Se　/　72 h　/　当前案例的最高剂量</small><h2>局部 SHAP 解释</h2><p>模型预测为 54.09%。以下为三项负向贡献，单位为百分点。</p><p>暴露浓度　 <b>−14.78</b><br>暴露时间　 <b>−1.48</b><br>Zeta 电位　 <b>−0.88</b></p><small>摘自最高剂量样本，解释模型输出，不推断因果。</small></article><article><h2>解释助手</h2><button id="ask">能给出精确的 IC50 吗？</button><output id="reply"></output></article></main><script>const doses=[0.25,.5,1,2,4,8,16,32,64,128,256,512], values=[92.97407400210902,92.89736955766458,92.69495887945389,92.41694592130095,92.3498815778666,91.22083657842161,87.92018024312296,80.14032913253412,76.98072252469754,69.27704890064184,54.434398256841206,54.09289979730075];const points=values.map((v,i)=>[10+i*600/11,137-(v-50)*2.8]);line.setAttribute('points',points.map(p=>p.join(',')).join(' '));function draw(){let i=Number(dose.value);unit.textContent=doses[i];v.textContent=values[i].toFixed(2)+'%';point.setAttribute('cx',points[i][0]);point.setAttribute('cy',points[i][1]);reply.textContent=''}dose.oninput=draw;ask.onclick=()=>{reply.textContent='示例回复 · 当前浓度 '+doses[dose.value]+' μmol/L Se 的预测存活率为 '+values[dose.value].toFixed(2)+'%。整条测试曲线未达到 50%，模型侧 IC50 只能报告为 >512 μmol/L Se。'};draw()</script></html>
