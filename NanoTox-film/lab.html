<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NanoTox Assistant | 分析工作台</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f0f3ee;color:#193b33;font:15px/1.48 "Microsoft YaHei",sans-serif}header{height:59px;background:#102e28;color:#e1efe6;display:flex;align-items:center;gap:16px;padding:0 3%}header b{font:29px Georgia}header sup{color:#99d7b4;font:12px Consolas}header span{margin-left:auto;font-size:13px}.shell{display:grid;grid-template-columns:195px 1fr;min-height:calc(100vh - 59px)}aside{background:#e5ebe3;padding:24px 12px;border-right:1px solid #c6d3c8}aside small{margin-left:12px}small,.ey{color:#57766a;font:12px/1.6 Consolas,"Microsoft YaHei",sans-serif;letter-spacing:.08em}button,select{font:inherit;color:inherit;cursor:pointer}button{border:1px solid #c3cfc3;border-radius:7px;background:white;padding:7px 12px}aside button{width:100%;text-align:left;margin:5px 0;padding:12px 10px;background:transparent;border:none;font-weight:600}aside button.on,.primary{background:#195e48;color:#fff}.sidefoot{border-top:1px solid #bfd0c1;margin:24px 10px;padding-top:15px;color:#567568;font-size:13px}main{padding:22px 3%;min-width:0;max-width:1550px;width:100%;margin:auto auto 0;align-self:start;margin-top:0}h1{font-size:29px;margin:2px 0 3px}h2{font-size:20px;margin:3px 0 8px}p{margin:5px 0;color:#476559}.top,.row,.filters,.keys{display:flex;align-items:center;justify-content:space-between;gap:12px}.filters{justify-content:flex-start;flex-wrap:wrap;margin:16px 0;background:#fffefa;border:1px solid #cbd6ca;padding:10px 14px;border-radius:10px}label{font-size:13px;color:#4e695d}select{background:#f2f5ee;border:1px solid #bbcabb;padding:4px 9px;border-radius:5px;margin-left:5px}.filters span{font:13px Consolas;color:#517165;margin-left:auto}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:10px 0}.kpi,.card{background:#fffefa;border:1px solid #c7d4c7;border-radius:11px}.kpi{padding:12px 16px}.kpi b{font:30px Georgia;display:block;color:#175c46}.grid{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(220px,1fr);gap:12px}.card{padding:17px 20px;margin:0 0 12px;min-width:0}.badge{display:inline-block;background:#e5f2e9;color:#2e6954;border-radius:20px;padding:3px 9px;font-size:12px}.keys{justify-content:flex-start;font-size:13px;color:#456555}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}svg{width:100%;display:block;max-height:270px}input[type=range]{width:100%;accent-color:#176e55}.detail{padding:10px 0;border-bottom:1px solid #dbe3d9}.detail b{float:right}.bar{height:7px;border-radius:4px;background:#e6ece4;margin:5px 0 8px}.bar i{height:100%;display:block;border-radius:4px}table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:7px 8px;text-align:right;border-bottom:1px solid #dee6dc}td:first-child,th:first-child{text-align:left}.selected{background:#eaf4eb}footer{font-size:12px;color:#587465;margin:8px 0 18px}.questions button{margin:4px}.reply{padding:18px;background:#eaf4eb;border-left:3px solid #538771;margin:14px 0}.error{color:#aa4429}@media(max-width:920px){.shell{grid-template-columns:145px 1fr}.grid{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){.shell{display:block}aside{padding:4px;display:flex;overflow:auto}aside small,.sidefoot{display:none}aside button{white-space:nowrap;width:auto}.row,.top{flex-wrap:wrap}}
</style><header><b>NanoTox Assistant</b></header><div class="shell"><aside><nav id="nav"></nav></aside><main><div class="top"><div><small>研究空间　/　纳米硒　/　HUVEC</small><h1 id="title">实验分析工作台</h1></div><button id="download">↓　导出当前数据</button></div><div class="filters"><label>材料<select id="mat"></select></label><label>时间<select id="hrs"><option>24</option><option>48</option><option selected>72</option></select> h</label><label>浓度<select id="dose"></select> μmol/L Se</label><span>RF　/　冻结模型</span></div><div id="kpis" class="kpis"></div><div id="panel">正在加载实验数据…</div><footer>实验表与预测按材料、时间和报告浓度配对。误差和模型贡献均以百分点计。</footer></main></div>
<script>
let data,tab=0,sort='obs',question=0;const tabs=['剂量与反应','材料横向对比','IC50 分析','模型因素解释','结果问答','配对数据表'],names=['Year','Particle size','Zeta potential','Time','Concentration','Cell count','Coating label','Surface charge','Synthesis method','Cell type','Cell tissue'],cn=['年份','粒径','Zeta 电位','暴露时间','暴露浓度','接种细胞数','包覆类别','表面电荷','合成方法','细胞类型','组织类型'];const fmt=(v,n=2)=>Number(v).toFixed(n),sg=v=>(v>=0?'+':'')+fmt(v),icval=s=>isFinite(s)?fmt(s):s;
const sorted=(a,k)=>a.slice().sort((x,y)=>x[k]-y[k]);function selection(){const series=sorted(data.rows.filter(r=>r.nanoparticle===mat.value&&r.time_h===+hrs.value),'concentration_reported');return {series,r:series.find(r=>r.concentration_reported===+dose.value),all:data.rows.filter(r=>r.time_h===+hrs.value&&r.concentration_reported===+dose.value),ic:data.ic.find(x=>x.time_h===+hrs.value&&x.nanoparticle===mat.value)}}
const detail=(a,b)=>'<div class="detail">'+a+'<b>'+b+'</b></div>',card=(a,b)=>'<article class="card"><small>'+a+'</small>'+b+'</article>',table=(head,body)=>'<table><thead><tr>'+head.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+body.join('')+'</tbody></table>',tr=(a,c='')=>'<tr class="'+c+'">'+a.map(x=>'<td>'+x+'</td>').join('')+'</tr>';
function chart(series,r){const a=series.filter(x=>x.concentration_reported>0),max=Math.max(110,...a.map(x=>x.viability_percent)),top=Math.ceil(max/20)*20,X=i=>43+i*524/11,Y=v=>179-154*v/top;let s='<svg viewBox="0 0 610 211" role="img" aria-label="实验实测与模型预测剂量反应曲线">';for(let v of [0,50,100,top].filter((v,i,l)=>l.indexOf(v)===i))s+='<path d="M43 '+Y(v)+'H570" stroke="'+(v===50?'#b78353':'#dce6dc')+'" stroke-dasharray="'+(v===50?'5 4':'0')+'"/><text x="6" y="'+(Y(v)+4)+'" font-size="12">'+v+'</text>';for(let [k,color] of [['pred','#1b805c'],['viability_percent','#c16c40']]){s+='<polyline points="'+a.map((r,i)=>X(i)+','+Y(r[k])).join(' ')+'" fill="none" stroke="'+color+'" stroke-width="3"/>';a.forEach((x,i)=>s+='<circle cx="'+X(i)+'" cy="'+Y(x[k])+'" r="'+(x===r?6:3)+'" fill="'+color+'"/>')}for(let i of [0,3,6,9,11])s+='<text x="'+(X(i)-10)+'" y="202" font-size="13">'+a[i].concentration_reported+'</text>';return s+'</svg>'}
function render(){const {series,r,all,ic}=selection(),diff=r.pred-r.viability_percent;title.textContent=tabs[tab];nav.innerHTML=tabs.map((x,i)=>'<button class="'+(tab===i?'on':'')+'" data-tab="'+i+'">'+String(i+1).padStart(2,'0')+'　'+x+'</button>').join('');kpis.innerHTML=[['预测存活率',fmt(r.pred)+'%'],['实验存活率',fmt(r.viability_percent)+'%'],['预测 − 实测',sg(diff)],['当前质量浓度',fmt(r.concentration_reported*.078971,3)+' μg/mL']].map(([a,b])=>'<div class="kpi"><small>'+a+'</small><b>'+b+'</b></div>').join('');const attrib=data.features.map(k=>[cn[names.indexOf(k)]||k,r[k]]).sort((a,b)=>Math.abs(b[1])-Math.abs(a[1]));let html='';
if(tab===0)html='<div class="grid">'+card('DOSE RESPONSE','<h2>剂量–反应曲线</h2><div class="keys"><span>🟢 模型预测</span><span>🟠 实验实测</span></div>'+chart(series,r)+'<label>浓度扫描　'+r.concentration_reported+' μmol/L Se<input aria-label="扫描剂量" id="scan" type="range" min="0" max="12" value="'+series.indexOf(r)+'"></label><small>横轴为正剂量对数刻度。零剂量对照可在滑块和配对表中查看。</small>')+card('SPECIMEN RECORD','<h2>'+r.nanoparticle+'</h2><span class="badge">HUVEC · 外部实验</span>'+detail('报告粒径',fmt(r.size_nm)+' nm')+detail('Zeta 电位',fmt(r.zeta_mV)+' mV')+detail('暴露时间',r.time_h+' h')+detail('曲线 MAE',fmt(series.reduce((s,x)=>s+Math.abs(x.pred-x.viability_percent),0)/series.length))+'<p>曲线误差汇总本材料、本时间的 13 个配对条件。</p>')+'</div>';
if(tab===1){const key=sort==='obs'?'viability_percent':'pred';html=card('MATERIAL COMPARISON','<div class="row"><h2>同条件材料排序</h2><label>按<select id="order"><option value="obs">实验存活率</option><option value="pred" '+(sort==='pred'?'selected':'')+'>模型预测</option></select></label></div><p>按存活率从低到高排列 · '+r.time_h+' h · '+r.concentration_reported+' μmol/L Se</p>'+table(['材料','实验存活率','预测存活率','预测 − 实测'],sorted(all,key).map(x=>tr([x.nanoparticle,fmt(x.viability_percent)+'%',fmt(x.pred)+'%',sg(x.pred-x.viability_percent)],x===r?'selected':''))))}
if(tab===2){html=card('HALF-MAXIMAL RESPONSE','<h2>材料的时间响应</h2><p>表观 IC50（μmol/L Se）· 相邻正剂量在 log₁₀ 浓度尺度插值</p>'+table(['时间','实验 IC50','模型 IC50','实验插值括区'],data.ic.filter(x=>x.nanoparticle===mat.value).map(x=>tr([x.time_h+' h',icval(x.ic50_display),icval(x.ic50_display_model),x.lower_concentration==null?'未达阈值':x.lower_concentration+' – '+x.upper_concentration],x===ic?'selected':'')))+'<p>“&gt;512”表示最高测试浓度内未达到 50% 存活率。</p>')}
if(tab===3){const max=Math.max(...attrib.map(a=>Math.abs(a[1])));html='<div class="grid">'+card('LOCAL ATTRIBUTION','<h2>按绝对贡献排序</h2>'+attrib.map(([k,v])=>'<div class="row">'+k+'<b>'+sg(v)+'</b></div><div class="bar"><i style="width:'+100*Math.abs(v)/max+'%;background:'+(v>=0?'#288863':'#c27a47')+'"></i></div>').join(''))+card('ADDITIVITY CHECK','<h2>预测值如何构成</h2>'+detail('模型基线',fmt(r.base_value)+'%')+detail('贡献合计',sg(attrib.reduce((s,a)=>s+a[1],0)))+detail('最终预测',fmt(r.pred)+'%')+'<p>绿色表示提高模型输出，橙色表示降低。归因描述模型，不代表因果关系。</p>')+'</div>'}
if(tab===4){let answers=['当前预测为 '+fmt(r.pred)+'%，实验实测为 '+fmt(r.viability_percent)+'%，预测与实测相差 '+sg(diff)+' 个百分点。','本材料在 '+r.time_h+' h 的实验侧 IC50 为 '+icval(ic.ic50_display)+' μmol/L Se，模型侧为 '+icval(ic.ic50_display_model)+' μmol/L Se。','当前绝对贡献最大的是'+attrib[0][0]+'，其模型贡献为 '+sg(attrib[0][1])+' 个百分点。'];html=card('EVIDENCE DESK','<h2>查询当前实验条件</h2><p>基于配对表与 SHAP 的规则问答</p><div class="questions">'+['预测和实验差多少？','是否达到 IC50？','哪个因素贡献最大？'].map((q,i)=>'<button data-q="'+i+'" class="'+(question===i?'primary':'')+'">'+q+'</button>').join('')+'</div><div class="reply">'+answers[question]+'</div><small>依据　'+mat.value+' · '+hrs.value+' h · '+dose.value+' μmol/L Se</small>')}
if(tab===5)html=card('PAIRED RECORDS','<h2>逐条件实验与预测</h2>'+table(['浓度 μmol/L Se','模型输入 μg/mL','实验 %','预测 %','误差 pp'],series.map(x=>tr([x.concentration_reported,fmt(x.concentration_reported*.078971,4),fmt(x.viability_percent),fmt(x.pred),sg(x.pred-x.viability_percent)],x===r?'selected':''))));
panel.innerHTML=html}
nav.onclick=e=>{if(e.target.dataset.tab!==undefined){tab=+e.target.dataset.tab;render()}};panel.onchange=e=>{if(e.target.id==='scan'){dose.selectedIndex=+e.target.value;render()}if(e.target.id==='order'){sort=e.target.value;render()}};panel.onclick=e=>{if(e.target.dataset.q!==undefined){question=+e.target.dataset.q;render()}};for(const el of [mat,hrs,dose])el.onchange=()=>render();
download.onclick=()=>{const {r,all,series}=selection();let records=tab===1?all:tab===2?data.ic.filter(x=>x.nanoparticle===mat.value):tab===3?data.features.map(k=>({feature:k,contribution:r[k]})):tab===4?[r]:series;const keys=Object.keys(records[0]);const csv=[keys,...records.map(x=>keys.map(k=>x[k]??''))].map(a=>a.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n');const url=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=mat.value+'-'+hrs.value+'h-'+tabs[tab]+'.csv';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000)};
(async()=>{const res=await fetch('/api/analysis');if(!res.ok)throw Error(res.status);data=await res.json();mat.innerHTML=[...new Set(data.rows.map(x=>x.nanoparticle))].map(x=>'<option>'+x+'</option>').join('');dose.innerHTML=[...new Set(data.rows.map(x=>x.concentration_reported))].sort((a,b)=>a-b).map(x=>'<option>'+x+'</option>').join('');dose.value='512';render()})().catch(e=>{panel.textContent='无法加载分析数据：'+e.message});
</script></html>
