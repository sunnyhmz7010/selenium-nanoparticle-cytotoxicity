name: Build Academic Manuscripts (ZH & EN)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build_manuscripts:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4

      # 1. 编译中文版 (使用 xelatex)
      - name: Build Chinese Version
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main_zh.tex
          compiler: xelatex
          args: "-pdf -file-line-error -halt-on-error -interaction=nonstopmode"

      # 2. 编译英文版 (ACS 投稿通常建议 pdflatex，也可统一用 xelatex)
      - name: Build English Version
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main_en.tex
          compiler: xelatex
          args: "-pdf -file-line-error -halt-on-error -interaction=nonstopmode"

      # 3. 生成带时间戳的文件名，并存入环境变量
      - name: Prepare Files and Names
        run: |
          export TZ='Asia/Shanghai'
          # 生成精确时间戳
          TIMESTAMP=$(date +'%Y%m%d_%H%M%S')
          
          # 定义中英文文件名（不带后缀，用于 Artifact 名字）
          ZH_NAME="Manuscript_ZH_$TIMESTAMP"
          EN_NAME="Manuscript_EN_$TIMESTAMP"
          
          # 实际生成文件
          cp main_zh.pdf "$ZH_NAME.pdf"
          cp main_en.pdf "$EN_NAME.pdf"
          
          # 【核心】将名字存入环境变量，供后续步骤使用
          echo "ZH_FILENAME=$ZH_NAME" >> $GITHUB_ENV
          echo "EN_FILENAME=$EN_NAME" >> $GITHUB_ENV

      # 4. 上传中文版（独立条目）
      - name: Upload Chinese PDF
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZH_FILENAME }}  # 显示名 = 文件名
          path: ${{ env.ZH_FILENAME }}.pdf

      # 5. 上传英文版（独立条目）
      - name: Upload English PDF
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EN_FILENAME }}  # 显示名 = 文件名
          path: ${{ env.EN_FILENAME }}.pdf