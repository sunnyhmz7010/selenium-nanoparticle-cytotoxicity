name: Build Academic Manuscripts (Manual)

on:
  workflow_dispatch: 

jobs:
  build_manuscripts:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4

      - name: Build Chinese Version
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main_zh.tex
          compiler: xelatex
          args: "-pdf -file-line-error -halt-on-error -interaction=nonstopmode"

      - name: Build English Version
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main_en.tex
          compiler: xelatex
          args: "-pdf -file-line-error -halt-on-error -interaction=nonstopmode"

      - name: Prepare Files and Names
        run: |
          export TZ='Asia/Shanghai'
          TIMESTAMP=$(date +'%Y%m%d_%H%M%S')
          
          ZH_NAME="Manuscript_ZH_$TIMESTAMP"
          EN_NAME="Manuscript_EN_$TIMESTAMP"
          
          cp main_zh.pdf "$ZH_NAME.pdf"
          cp main_en.pdf "$EN_NAME.pdf"
          
          echo "ZH_FILENAME=$ZH_NAME" >> $GITHUB_ENV
          echo "EN_FILENAME=$EN_NAME" >> $GITHUB_ENV

      - name: Upload Chinese PDF
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZH_FILENAME }}
          path: ${{ env.ZH_FILENAME }}.pdf

      - name: Upload English PDF
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EN_FILENAME }}
          path: ${{ env.EN_FILENAME }}.pdf