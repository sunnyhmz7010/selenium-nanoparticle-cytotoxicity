name: Build and Auto-Push to Output

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Manuscript
        uses: xu-cheng/latex-action@v3
        with:
          root_file: manuscript.tex
          compiler: latexmk
          args: "-xelatex -file-line-error -halt-on-error -interaction=nonstopmode"

      - name: Commit and Push PDFs and Sources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          export TZ='Asia/Shanghai'
          TIMESTAMP=$(date +'%Y%m%d_%H%M%S')

          # 将 manuscript.tex 的 sections/ 展开合并为单文件稿，覆盖写为 main.tex（供 Overleaf 直接使用），
          # 同时从 \title{} 提取论文名作为 PDF 文件名（时间戳作前缀，便于区分每次构建）
          # 标题中的半角冒号在 Windows 文件名中非法，替换为 " - "
          TITLE=$(python3 - <<'PYEOF'
          import pathlib, re
          main = pathlib.Path('manuscript.tex').read_text(encoding='utf-8')
          pat = re.compile(r'\\input\{(sections/[^}]+)\}')
          count = len(pat.findall(main))
          def repl(m):
              return pathlib.Path(m.group(1) + '.tex').read_text(encoding='utf-8')
          pathlib.Path('main.tex').write_text(pat.sub(repl, main), encoding='utf-8')
          m = re.search(r'\\title\{(.+?)\}', main, re.S)
          print(re.sub(r'\s*:\s*', ' - ', m.group(1).strip()) if m else 'Manuscript')
          PYEOF
          )

          mkdir -p publish
          cp manuscript.pdf "publish/${TIMESTAMP}_$TITLE.pdf"
          cp main.tex references.bib publish/

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          cd publish
          git init
          git checkout -b output
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add .
          git commit -m "Auto-build: PDFs and sources updated at $TIMESTAMP"

          git push origin output --force
