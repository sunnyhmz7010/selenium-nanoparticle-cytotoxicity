name: Build and Auto-Push to Output

on:
  workflow_dispatch:

permissions:
  contents: write

# output 是共同发布目标，排队执行，避免两个手动构建同时推送。
concurrency:
  group: manuscript-pdf-output
  cancel-in-progress: false

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Chinese V2 Manuscript
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: paper/v2
          root_file: manuscript_zh.tex
          compiler: latexmk
          args: "-xelatex -file-line-error -halt-on-error -interaction=nonstopmode"

      - name: Package PDF and Sources
        id: package
        shell: bash
        run: |
          set -euo pipefail
          export TZ='Asia/Shanghai'
          TIMESTAMP=$(date +'%Y%m%d_%H%M%S')
          # 沿用原发布约定：每次从空目录打包，不继承 output 的旧产物。
          test ! -e publish
          python3 paper/scripts/package_pdf_output.py paper/v2/manuscript_zh.tex publish "$TIMESTAMP"
          echo "timestamp=$TIMESTAMP" >> "$GITHUB_OUTPUT"

      - name: Commit and Push PDFs and Sources
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TIMESTAMP: ${{ steps.package.outputs.timestamp }}
        run: |
          set -euo pipefail
          # 独立初始化仓库，使 output 只保留本次构建的一个根提交。
          git -C publish init -b output
          git -C publish config user.name 'github-actions[bot]'
          git -C publish config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C publish remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C publish add -- .
          git -C publish commit -m "Auto-build: PDFs and sources updated at $TIMESTAMP"
          git -C publish push origin output --force
          {
            echo '### 中文 V2 PDF 已发布'
            echo
            echo "构建时间（北京时间）：$TIMESTAMP"
            echo
            echo "[查看 output 分支的 PDF 和配套稿源](https://github.com/$GITHUB_REPOSITORY/tree/output)"
          } >> "$GITHUB_STEP_SUMMARY"
