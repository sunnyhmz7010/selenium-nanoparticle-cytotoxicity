name: Build and Publish V1 Bilingual Manuscripts

on:
  workflow_dispatch:

permissions:
  contents: write

# 所有论文版本共用发布分支，串行更新各自目录。
concurrency:
  group: paper-output
  cancel-in-progress: false

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Chinese V1 Manuscript
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: paper/v1
          root_file: manuscript-zh.tex
          compiler: latexmk
          args: "-xelatex -file-line-error -halt-on-error -interaction=nonstopmode"

      - name: Build English V1 Manuscript
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: paper/v1
          root_file: manuscript.tex
          compiler: latexmk
          args: "-xelatex -file-line-error -halt-on-error -interaction=nonstopmode"

      - name: Package V1 PDFs and Single-File Sources
        id: package
        shell: bash
        run: |
          set -euo pipefail
          export TZ='Asia/Shanghai'
          export TIMESTAMP=$(date +'%Y%m%d_%H%M%S')
          python3 - <<'PY'
          import os
          import re
          import shutil
          from pathlib import Path

          root = Path('paper/v1').resolve()
          destination = Path('build-output/V1')
          timestamp = os.environ['TIMESTAMP']
          inputs = re.compile(r'\\input\{([^}]+)\}')

          def expand(path, parents=()):
              path = path.resolve()
              path.relative_to(root)
              if path in parents:
                  raise ValueError(f'循环 input 引用：{path}')

              def replace(match):
                  included = root / match.group(1)
                  if not included.suffix:
                      included = included.with_suffix('.tex')
                  return expand(included, parents + (path,))

              lines = []
              for line in path.read_text(encoding='utf-8').splitlines(keepends=True):
                  # 仅展开有效正文中的 input，保留注释和转义百分号。
                  cut = len(line)
                  for match in re.finditer('%', line):
                      prefix = line[:match.start()]
                      if (len(prefix) - len(prefix.rstrip('\\'))) % 2 == 0:
                          cut = match.start()
                          break
                  lines.append(inputs.sub(replace, line[:cut]) + line[cut:])
              return ''.join(lines)

          # 先核验两版编译产物与共用文献库，再生成完整的本次发布目录。
          sources = [('EN', root / 'manuscript.tex'), ('ZH', root / 'manuscript-zh.tex')]
          merged = [(language, source, expand(source)) for language, source in sources]
          for _, source, _ in merged:
              if not source.with_suffix('.pdf').is_file():
                  raise FileNotFoundError(f'缺少编译产物：{source.with_suffix(".pdf")}')
          if not (root / 'references.bib').is_file():
              raise FileNotFoundError('缺少共用文献库 references.bib')
          destination.mkdir(parents=True, exist_ok=False)
          for language, source, text in merged:
              (destination / f'Manuscript_{language}.tex').write_text(text, encoding='utf-8', newline='\n')
              shutil.copy2(source.with_suffix('.pdf'), destination / f'Manuscript_{language}_{timestamp}.pdf')
          shutil.copy2(root / 'references.bib', destination / 'references.bib')
          PY
          echo "timestamp=$TIMESTAMP" >> "$GITHUB_OUTPUT"

      - name: Prepare Paper Output Branch
        shell: bash
        run: |
          set -euo pipefail
          status=0
          git ls-remote --exit-code --heads origin refs/heads/paper-output > "$RUNNER_TEMP/paper-output-ref" || status=$?
          if [ "$status" -eq 0 ]; then
            git fetch --depth=1 origin refs/heads/paper-output:refs/remotes/origin/paper-output
            git worktree add -b paper-output publish refs/remotes/origin/paper-output
          elif [ "$status" -eq 2 ]; then
            git worktree add --detach publish HEAD
            git -C publish switch --orphan paper-output
          else
            exit "$status"
          fi

      - name: Replace V1 Outputs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import shutil
          from pathlib import Path

          root = Path('publish').resolve()
          if not (root / '.git').exists():
              raise ValueError('发布目录不是 Git 工作区')
          destination = root / 'V1'
          # 更新范围固定为发布工作区的 V1，保留其他版本目录和分支历史。
          destination.resolve().relative_to(root)
          if destination.is_symlink():
              raise ValueError('V1 发布目录不能是符号链接')
          if destination.exists():
              shutil.rmtree(destination)
          shutil.copytree(Path('build-output/V1'), destination)
          PY

      - name: Commit and Push V1 Outputs
        shell: bash
        env:
          TIMESTAMP: ${{ steps.package.outputs.timestamp }}
        run: |
          set -euo pipefail
          git -C publish config user.name 'github-actions[bot]'
          git -C publish config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C publish add -- V1
          if ! git -C publish diff --cached --quiet; then
            git -C publish commit -m "build(paper): 更新V1双语PDF和单文件稿源（$TIMESTAMP）"
          fi
          git -C publish push origin HEAD:refs/heads/paper-output
          {
            echo '### V1 中英双语稿已发布'
            echo
            echo "构建时间（北京时间）：$TIMESTAMP"
            echo
            echo "[查看 V1 PDF、单文件稿源和 Bib](https://github.com/$GITHUB_REPOSITORY/tree/paper-output/V1)"
          } >> "$GITHUB_STEP_SUMMARY"
