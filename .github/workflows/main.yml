name: Build and Auto-Push to Output

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Chinese Version
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main_zh.tex
          compiler: latexmk
          args: "-xelatex -file-line-error -halt-on-error -interaction=nonstopmode"

      - name: Build English Version
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main_en.tex
          compiler: latexmk
          args: "-xelatex -file-line-error -halt-on-error -interaction=nonstopmode"

      - name: Commit and Push PDFs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          export TZ='Asia/Shanghai'
          TIMESTAMP=$(date +'%Y%m%d_%H%M%S')

          mkdir -p publish
          cp main_zh.pdf "publish/Manuscript_ZH_$TIMESTAMP.pdf"
          cp main_en.pdf "publish/Manuscript_EN_$TIMESTAMP.pdf"

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          cd publish
          git init
          git checkout -b output
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add *.pdf
          git commit -m "Auto-build: PDFs updated at $TIMESTAMP"

          git push origin output --force
