name: Package LaTeX Sources

# 手动触发：将 sections_en/* 展开合并进 main_en.tex，生成单一完整 tex，
# 连同所需 bib 打包为 zip，供从 Actions Artifacts 直接下载
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Flatten sections into single manuscript
        run: |
          python3 - <<'PYEOF'
          import pathlib, re
          main = pathlib.Path('main_en.tex').read_text(encoding='utf-8')
          count = len(re.findall(r'\\input\{sections_en/', main))
          def repl(m):
              return pathlib.Path(m.group(1) + '.tex').read_text(encoding='utf-8')
          out = re.sub(r'\\input\{(sections_en/[^}]+)\}', repl, main)
          pathlib.Path('Manuscript_EN.tex').write_text(out, encoding='utf-8')
          print(f'expanded {count} input files -> Manuscript_EN.tex')
          PYEOF

      - name: Package sources
        run: |
          mkdir stage
          cp Manuscript_EN.tex references.bib stage/
          cat > stage/README.txt <<'EOF'
          English manuscript, single-file version.

          Compile:
              latexmk -xelatex Manuscript_EN.tex

          Files:
              Manuscript_EN.tex   complete manuscript (all sections inlined)
              references.bib      unified bibliography (literature + ML models)
          EOF
          cd stage
          zip -r ../Manuscript_EN_single.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Manuscript_EN_single
          path: Manuscript_EN_single.zip
